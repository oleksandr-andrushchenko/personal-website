{% set items_active = block["items"] | selectattr("active") | list %}

<div class="container" id="{{ block.id }}">
    <h2 class="
        mb-2
        mb-sm-2
        mb-md-2
        mb-lg-2
        mb-xl-3
        mb-xxl-3
    ">
        {{ block.header }} &mdash; {{ items_active | length }}
    </h2>

    <div class="masonry-preview" data-masonry-preview>
        <div id="grid-{{ block.id }}" tabindex="-1" class="
            row row-cols-1 g-1
            row-cols-sm-{{ block.cols.sm | default(1) }}
            row-cols-md-{{ block.cols.md | default(2) }}
            row-cols-lg-{{ block.cols.lg | default(3) }}
            row-cols-xl-{{ block.cols.xl | default(3) }}
            row-cols-xxl-{{ block.cols.xxl | default(3) }}
            g-sm-1
            g-md-2
            g-xl-3
            g-xxl-3
        " data-masonry='{"percentPosition":true}'>
            {% set salt = block.id %}
            {% for item in items_active %}
                <div class="col">
                    {% set index = loop.index %}

                    <div class="card bg-light shadow-sm">
                        {% include (block.id ~ "_block_item.html") with context %}
                    </div>
                </div>
            {% endfor %}
        </div>

        <button class="masonry-preview-expand" type="button" hidden
                aria-expanded="false" aria-controls="grid-{{ block.id }}">
            <span>Show all {{ items_active | length }} <span class="visually-hidden">{{ block.header }}</span></span>
            <i class="bi bi-chevron-down" aria-hidden="true"></i>
        </button>
    </div>
</div>
