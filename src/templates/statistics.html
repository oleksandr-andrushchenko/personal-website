{% if block.cover_image.active %}
    <style>
        .bg-img-stat::before {
            background-image: url('/{{ block.cover_image.filename }}');
            background-position: {{ block.cover_image.position_x | default('center') }} {{ block.cover_image.position_y | default('center') }};
        }
    </style>
{% endif %}

<div class="text-bg-light py-4 d-print-none {{ ("bg-img bg-img-stat bg-img-" ~ block.cover_image.bg_color | default("light")) if block.cover_image.active else '' }}">
    <div class="container">
        <div class="
            row row-cols-2 text-{{ block.text_color if block.text_color else "body" }}
            row-cols-sm-{{ block.cols.sm | default(1) }}
            row-cols-md-{{ block.cols.md | default(2) }}
            row-cols-lg-{{ block.cols.lg | default(3) }}
            row-cols-xl-{{ block.cols.xl | default(3) }}
            row-cols-xxl-{{ block.cols.xxl | default(3) }}
        ">
            {% for item in block["items"] | selectattr('active') %}
                <div class="col text-center py-3">
                    <span class="h1">{{ item.number }}</span>
                    <div>{{ item.header }}</div>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
